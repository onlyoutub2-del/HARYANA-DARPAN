<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article Reader | Haryana Darpan</title><meta name="description" content="Haryana Darpan continuous article reader."><meta name="robots" content="index,follow">
<style>:root{--bg:#0b0d10;--card:#11151a;--text:#f5f7fa;--muted:#aeb6c2;--line:#29303a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.75}.wrap{width:min(850px,92%);margin:auto;padding:22px 0 80px}a{color:#ff9b43}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:25px}.logo{font-weight:900;color:#fff;text-decoration:none}.logo span{color:#ff8f69}.article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:35px}.article h1{line-height:1.25}.article h2{margin-top:28px}.article img{max-width:100%;height:auto;border-radius:12px}.article .meta{color:var(--muted)}.loader{text-align:center;color:var(--muted);padding:25px}.error{padding:18px;border:1px solid #51312a;border-radius:12px;color:#ffb7a3;background:#1b1210}</style>
</head><body><main class="wrap"><div class="top"><a class="logo" href="./">HARYANA <span>DARPAN</span></a><a href="blogs.html">← All Blogs</a></div><div id="reader"></div><div id="loader" class="loader">Article load हो रहा है...</div></main>
<script>
const OWNER='onlyoutub2-del',REPO='desivlogindia',BRANCH='main',reader=document.getElementById('reader'),loader=document.getElementById('loader');let posts=[],index=0,loading=false,done=false,observer;
function titleFromFile(name){return name.replace(/\.html$/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
async function getPosts(){const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/blogs?ref='+BRANCH);if(!r.ok)throw Error();const d=await r.json();return d.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.html')).map(x=>({name:x.name,title:titleFromFile(x.name)})).sort((a,b)=>b.name.localeCompare(a.name))}
function observeLast(){if(observer)observer.disconnect();const a=reader.querySelectorAll('.article'),last=a[a.length-1];if(!last)return;observer=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){observer.disconnect();loadPost(index)}},{rootMargin:'0px 0px 700px 0px'});observer.observe(last)}
async function loadPost(i){if(loading||done)return;if(i>=posts.length){done=true;loader.textContent='आपने सभी available articles पढ़ लिए हैं।';return}loading=true;loader.textContent='अगला article load हो रहा है…';try{const p=posts[i],r=await fetch('blogs/'+encodeURIComponent(p.name));if(!r.ok)throw Error();const doc=new DOMParser().parseFromString(await r.text(),'text/html'),article=document.createElement('article');article.className='article';[...doc.body.children].forEach(el=>{if(el.tagName!=='SCRIPT'&&el.tagName!=='STYLE')article.appendChild(el.cloneNode(true))});reader.appendChild(article);index=i+1;if(index>=posts.length)done=true;if(!done)observeLast()}
(async()=>{try{posts=await getPosts();const wanted=new URLSearchParams(location.search).get('post');let start=posts.findIndex(p=>p.name===wanted);if(start<0)start=0;await loadPost(start)}catch(e){loader.innerHTML='<div class="error">Articles अभी load नहीं हो पाए। कुछ देर बाद refresh करें।</div>'}})();
</script></body></html>
