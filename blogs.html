<style>
:root{--bg:#0b0d10;--card:#14181e;--text:#f7f8fa;--muted:#aeb6c2;--accent:#ff5b35;--line:#29303a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,92%);margin:auto;padding:25px 0 70px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:900;font-size:20px}.logo span,.tag{color:#ff8f69}.nav a{margin-left:14px;color:#dbe0e7;font-size:14px;font-weight:700}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.05;margin:0 0 12px}.hero p{color:var(--muted);max-width:750px}.tools{display:flex;gap:10px;margin:20px 0}.tools input{width:100%;padding:14px 16px;border-radius:11px;border:1px solid var(--line);background:#11151a;color:#fff;font-size:16px}.count{color:var(--muted);font-size:14px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px}.card h2{font-size:20px;line-height:1.3;margin:9px 0}.card p{color:var(--muted);font-size:14px}.btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:9px;background:var(--accent);font-weight:850}.error{padding:18px;border:1px solid #51312a;border-radius:12px;color:#ffb7a3;background:#1b1210}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.top{align-items:flex-start;flex-direction:column}.nav a{margin:0 12px 0 0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><a class="logo" href="./">DESI <span>VLOG INDIA</span></a><div class="nav"><a href="./">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="https://www.youtube.com/@YogeshSaharan1" target="_blank" rel="noopener">YouTube</a></div></div>
<section class="hero"><div class="tag">HARYANA • NEWS • JOBS • GUIDES • VLOGS</div><h1>All Blogs</h1><p>Haryana की news, jobs, ITI/apprentice opportunities, useful guides और local vlog stories एक जगह। नीचे search से article खोजें।</p></section>
<div class="tools"><input id="search" type="search" placeholder="News, job या topic search करें..." aria-label="Search blogs"></div>
<div id="count" class="count">Blogs load हो रहे हैं...</div><div id="grid" class="grid"></div><div id="error"></div>
</div>
<script>
const OWNER='onlyoutub2-del',REPO='desivlogindia',BRANCH='main';const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),error=document.getElementById('error');let posts=[];
function titleFromFile(name){return name.replace(/\.html$/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function render(){const q=search.value.trim().toLowerCase();const filtered=posts.filter(p=>(p.title+' '+p.name).toLowerCase().includes(q));count.textContent=filtered.length+' article'+(filtered.length===1?'':'s')+' available';grid.innerHTML=filtered.map(p=>'<article class="card"><span class="tag">ARTICLE</span><h2>'+p.title+'</h2><p>Desi Vlog India पर इस topic से जुड़ी useful information और story पढ़ें।</p><a class="btn" href="article-reader.html?post='+encodeURIComponent(p.name)+'">Read Article →</a></article>').join('')||'<p class="count">कोई article नहीं मिला।</p>'}
async function load(){try{const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/blogs?ref='+BRANCH);if(!r.ok)throw new Error();const data=await r.json();posts=data.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.html')).map(x=>({name:x.name,title:titleFromFile(x.name)})).sort((a,b)=>b.name.localeCompare(a.name));render()}catch(e){error.innerHTML='<div class="error">Articles अभी load नहीं हो पाए। कुछ देर बाद refresh करें।</div>';count.textContent=''}}
search.addEventListener('input',render);load();
</script></body></html>
