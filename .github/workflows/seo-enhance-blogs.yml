name: Enhance blog SEO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-enhance-blogs.yml"
      - "blogs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SEO metadata to blog pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          from xml.sax.saxutils import escape
          import re, json

          base = "https://onlyoutub2-del.github.io/desivlogindia"
          changed = 0

          for path in Path("blogs").glob("*.html"):
              s = path.read_text(encoding="utf-8", errors="ignore")
              title_m = re.search(r"<title>(.*?)</title>", s, re.I|re.S)
              desc_m = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', s, re.I|re.S)
              h1_m = re.search(r"<h1>(.*?)</h1>", s, re.I|re.S)

              title = unescape(re.sub(r"<[^>]+>", "", title_m.group(1)).strip()) if title_m else path.stem.replace("-", " ").title()
              desc = unescape(re.sub(r"<[^>]+>", "", desc_m.group(1)).strip()) if desc_m else title
              h1 = unescape(re.sub(r"<[^>]+>", "", h1_m.group(1)).strip()) if h1_m else title
              url = f"{base}/blogs/{path.name}"

              # Remove previously generated block so this workflow stays idempotent.
              s = re.sub(r'<!-- AUTO_SEO_START -->.*?<!-- AUTO_SEO_END -->\s*', '', s, flags=re.S|re.I)

              block = f'''<!-- AUTO_SEO_START -->
<link rel="canonical" href="{escape(url)}">
<meta property="og:type" content="article">
<meta property="og:title" content="{escape(title)}">
<meta property="og:description" content="{escape(desc[:160])}">
<meta property="og:url" content="{escape(url)}">
<meta property="og:site_name" content="Desi Vlog India">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{escape(title)}">
<meta name="twitter:description" content="{escape(desc[:160])}">
<script type="application/ld+json">{json.dumps({
                "@context":"https://schema.org",
                "@type":"Article",
                "headline":h1,
                "description":desc[:300],
                "url":url,
                "author":{"@type":"Person","name":"Yogesh Saharan"},
                "publisher":{"@type":"Organization","name":"Desi Vlog India","url":base+"/"}
              }, ensure_ascii=False)}</script>
<!-- AUTO_SEO_END -->
'''
              if "</head>" in s.lower():
                  s = re.sub(r"</head>", block + "</head>", s, count=1, flags=re.I)
              else:
                  continue

              path.write_text(s, encoding="utf-8")
              changed += 1

          print(f"Enhanced {changed} blog pages")
          PY

      - name: Commit SEO changes
        run: |
          git config user.name "desivlogindia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blogs
          git diff --cached --quiet && echo "SEO metadata already up to date." && exit 0
          git commit -m "Add SEO metadata and Article schema to blogs"
          git push origin main
